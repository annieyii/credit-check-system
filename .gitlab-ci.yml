stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PROJECT_ENVIRONMENT: ".venv"
  DB_PATH: "db/database/curriculum.db"

default:
  image: python:3.10-slim
  before_script:
    # 1. 安裝 uv
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    
    # 2. 直接把 uv 的安裝路徑加入到目前的 PATH 環境變數中
    - export PATH="$HOME/.local/bin:$PATH"
    
    # 3. 測試看看系統認不認得 uv（這行可以幫忙在 Log 確認狀態）
    - uv --version
    
    # 4. 執行同步
    - uv sync --all-groups
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
      - .venv/

# 只在以下情況觸發：backend/tests/db 有變動，且是 MR 或指定分支的 push
.backend-rules: &backend-rules
  rules:
    # 情況 1：如果是 Merge Request，則有改動才跑
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - tests/**/*
        - db/**/*
        - pyproject.toml
        - .gitlab-ci.yml

    # 情況 2：如果是 main 分支，無論如何都「強制執行」（拔掉 changes 限制）
    - if: '$CI_COMMIT_BRANCH == "main"'

    # 情況 3：如果是其他後端開發分支，有改動才跑
    - if: '$CI_COMMIT_BRANCH =~ /^(backend-.*|integration\/.*)$/'
      changes:
        - backend/**/*
        - tests/**/*
        - db/**/*
        - pyproject.toml
        - .gitlab-ci.yml

# Job 1: Lint
lint:
  stage: lint
  <<: *backend-rules
  script:
    - uv run ruff check backend/ tests/

# Job 2: Test
test:
  stage: test
  <<: *backend-rules
  script:
    - uv run pytest tests/ --cov=backend --cov-report=term-missing -v
  coverage: '/TOTAL.*\s+(\d+%)$/'
