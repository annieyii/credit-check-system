stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PROJECT_ENVIRONMENT: ".venv"
  DB_PATH: "db/database/curriculum.db"

default:
  image: python:3.10-slim
  before_script:
    - pip install uv --quiet
    - uv sync --all-groups 
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
      - .venv/

# 只在以下情況觸發：backend/tests/db 有變動，且是 MR 或指定分支的 push
.backend-rules: &backend-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - tests/**/*
        - db/**/*
        - pyproject.toml
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH =~ /^(main|backend-.*|integration\/.*)$/'
      changes:
        - backend/**/*
        - tests/**/*
        - db/**/*
        - pyproject.toml
        - .gitlab-ci.yml

# ─── Job 1: Lint ───────────────────────────────────────────
lint:
  stage: lint
  <<: *backend-rules
  script:
    - |
      set -o pipefail
      uv run ruff check backend/ tests/ 2>&1 | tee lint-output.log
  artifacts:
    paths:
      - lint-output.log
    expire_in: 7 days
    when: always

# ─── Job 2: Test ───────────────────────────────────────────
test:
  stage: test
  <<: *backend-rules
  script:
    - |
      set -o pipefail
      uv run pytest tests/ \
        --cov=backend \
        --cov-report=xml \
        --cov-report=term-missing \
        --junitxml=test-results.xml \
        -v \
        2>&1 | tee test-output.log
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - test-output.log
      - test-results.xml
      - coverage.xml
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
    when: always
