stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PROJECT_ENVIRONMENT: ".venv"
  DB_PATH: "db/database/curriculum.db"

default:
  image: python:3.10-slim
  before_script:
    - uv sync --all-groups
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
      - .venv/

# 只在以下情況觸發：backend/tests/db 有變動，且是 MR 或指定分支的 push
.backend-rules: &backend-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - tests/**/*
        - db/**/*
        - pyproject.toml
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH =~ /^(main|backend-.*|integration\/.*)$/'
      changes:
        - backend/**/*
        - tests/**/*
        - db/**/*
        - pyproject.toml
        - .gitlab-ci.yml

# ─── Job 1: Lint ───────────────────────────────────────────
lint:
  stage: lint
  <<: *backend-rules
  script:
    - uv run ruff check backend/ tests/

# ─── Job 2: Test ───────────────────────────────────────────
test:
  stage: test
  <<: *backend-rules
  script:
    - uv run pytest tests/ --cov=backend --cov-report=term-missing -v
  coverage: '/TOTAL.*\s+(\d+%)$/'
